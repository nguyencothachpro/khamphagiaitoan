<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khám Phá Giải Toán</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app"><header class="top"><a class="logo" href="/">Khám Phá <b>Giải Toán</b></a><button id="clearBtn" class="ghost">Cuộc trò chuyện mới</button></header>
<main class="chat"><section id="messages" class="messages"><div class="welcome"><div class="mark">∑</div><h1>Đưa bài toán cho tôi</h1><p>Anh có thể <b>gõ đề</b>, <b>dán ảnh chụp màn hình</b>, kéo thả ảnh hoặc <b>đính kèm PDF/Word/ảnh</b>. Tôi sẽ cùng anh phân tích và giải theo đúng cách mình đã thống nhất.</p><div class="examples"><button data-example="Giải bài toán này từ những kiến thức nhỏ nhất, giải thích vì sao phải làm từng bước và sau cùng cho tôi 5 bài tương tự.">🧮 Giải bài toán</button><button data-example="Phân tích bài toán này theo kiểu khám phá: đâu là dữ kiện, đâu là manh mối và nên hỏi học sinh câu gì trước?">🔎 Tìm hướng khám phá</button><button data-example="Hãy kiểm tra lời giải này, chỉ ra chỗ học sinh dễ sai và sửa cách trình bày cho rõ bản chất.">✏️ Kiểm tra lời giải</button></div></div></section>
<section class="composer-wrap"><div id="attachments" class="attachments"></div><div class="composer"><button id="attachBtn" class="icon-btn" title="Đính kèm tệp">＋</button><input id="fileInput" type="file" hidden accept="image/*,.pdf,.doc,.docx,.txt,.md"><textarea id="prompt" rows="1" placeholder="Nhập câu hỏi hoặc dán ảnh bài toán vào đây..."></textarea><button id="sendBtn" class="send" title="Gửi">↑</button></div><div class="hint">Enter để gửi · Shift + Enter để xuống dòng · Ctrl/Cmd + V để dán ảnh chụp màn hình</div></section></main></div><script src="app.js"></script></body></html>
